name: Apply adaptive study update

on:
  push:
    branches:
      - feat/adaptive-study-gate
    paths:
      - .github/workflows/apply-adaptive-study-update.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out update branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Reconstruct and apply update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          blobs=(
            7221ee6957ec76274dd78521c44598ff3b4809ca
            e723bfee0f8e785ce346b346ed119e812e565e8e
            9028827874e2821b6a17920233f6434f90002470
            6269cd494d8d0d84ca360ce7745745ce09e4b164
            eb8dda76b1dfc6a9f26add1b9f7f04a3955f8d9a
          )

          : > /tmp/adaptive-study-update.b64
          for sha in "${blobs[@]}"; do
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' \
              | tr -d '\n' \
              | base64 --decode \
              >> /tmp/adaptive-study-update.b64
          done

          test "$(wc -c < /tmp/adaptive-study-update.b64)" -eq 42536
          base64 --decode /tmp/adaptive-study-update.b64 > /tmp/adaptive-study-update.tar.xz
          echo "240c9ec9cd4d0d515fb91fadce0942e8cbe721130e67f6287554f8efdc1f4902  /tmp/adaptive-study-update.tar.xz" \
            | sha256sum --check --strict
          tar -xJf /tmp/adaptive-study-update.tar.xz -C "${GITHUB_WORKSPACE}"

          git restore --source=HEAD --worktree .github/workflows/ci.yml

          sed -i \
            's/Before drafting requirements or TODOs, perform mandatory internal repository study, explicitly assess adaptive external-research triggers,/Before drafting requirements or TODOs, run the adaptive study gate: perform mandatory internal repository study, explicitly assess external-research triggers,/' \
            skill/plan-and-execute/agents/openai.yaml

          python3 - <<'PY'
          from pathlib import Path

          cli = Path("test/cli.test.js")
          cli_text = cli.read_text(encoding="utf-8")
          cli_anchor = "const cli = path.join(root, 'bin', 'plan-and-execute.js');\n"
          cli_replacement = (
              cli_anchor
              + "const packageVersion = JSON.parse(\n"
              + "  fs.readFileSync(path.join(root, 'package.json'), 'utf8')\n"
              + ").version;\n"
          )
          if cli_anchor not in cli_text:
              raise SystemExit("cli version anchor not found")
          cli_text = cli_text.replace(cli_anchor, cli_replacement, 1)
          old_cli_assertion = r"    assert.match(version.stdout, /^0\.3\.0\s*$/);"
          if old_cli_assertion not in cli_text:
              raise SystemExit("cli version assertion not found")
          cli_text = cli_text.replace(
              old_cli_assertion,
              "    assert.equal(version.stdout.trim(), packageVersion);",
              1,
          )
          cli.write_text(cli_text, encoding="utf-8")

          installer = Path("test/installer.test.js")
          installer_text = installer.read_text(encoding="utf-8")
          installer_anchor = "} from '../lib/installer.js';\n"
          installer_replacement = (
              installer_anchor
              + "\nconst packageVersion = JSON.parse(\n"
              + "  fs.readFileSync(new URL('../package.json', import.meta.url), 'utf8')\n"
              + ").version;\n"
          )
          if installer_anchor not in installer_text:
              raise SystemExit("installer version anchor not found")
          installer_text = installer_text.replace(
              installer_anchor,
              installer_replacement,
              1,
          )
          old_installer_assertion = (
              "    assert.ok(status.every((item) => item.version === '0.3.0'));"
          )
          if old_installer_assertion not in installer_text:
              raise SystemExit("installer version assertion not found")
          installer_text = installer_text.replace(
              old_installer_assertion,
              "    assert.ok(status.every((item) => item.version === packageVersion));",
              1,
          )
          installer.write_text(installer_text, encoding="utf-8")
          PY

          chmod +x \
            skill/plan-and-execute/scripts/studyctl.py \
            skill/plan-and-execute/scripts/study_self_test.py \
            tools/run-skill-self-test.js \
            tools/validate-skill.js

      - name: Install dependencies
        run: npm ci

      - name: Run complete validation suite
        run: npm run check

      - name: Verify npm package contents
        run: npm pack --dry-run --ignore-scripts

      - name: Commit validated non-workflow changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add adaptive pre-plan study gate"
          git push origin "HEAD:${GITHUB_REF_NAME}"
