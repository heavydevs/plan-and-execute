name: Bootstrap complete repository

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Reconstruct exact repository contents
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import os
          import shutil
          import tarfile
          import urllib.request
          from pathlib import Path

          repository = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          api = f'https://api.github.com/repos/{repository}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'plan-and-execute-bootstrap',
          }

          direct_blobs = {
              '.github/workflows/ci.yml': 'eecba526d23a6b1cf7aa1a345112bea48388ebf8',
              '.github/workflows/publish.yml': '687ffa3438c013c4dff8285ba2b32a746f906025',
              '.gitignore': 'be239a02eb52fb20a64dca07ae9f04a0334c14d8',
              '.npmignore': 'f394cc8e8e12749ee77d114d4bb3227fd9dcaf81',
              'CHANGELOG.md': '35c8530dd419e380c6aabaa558651b2b17ee65d8',
              'CONTRIBUTING.md': 'e256fc607b537198506ce176a5b87de1118b21c4',
              'LICENSE': '2673117de9ed7a5a5a6abd5c4f7e8d19a76b5f90',
              'README.md': 'ff88a7ab00248e3b12b189bbd2cf241fee7cf5f1',
              'SECURITY.md': '07614b29d2e2acd20a9d54e91666577225653d69',
              'bin/plan-and-execute.js': 'f26b5f976295191bcc4bcbc3bcf5454c602f1512',
              'docs/PUBLISHING.md': '22c9fc82f00f4e9432e1027d9ff2219cc6d72ccb',
              'lib/installer.js': '3aa439fbcb4eeac1422393520d3f88abe1d530b5',
              'package-lock.json': '9a285d247350ba94e521afc1b23a795c67e17ef9',
              'package.json': '1b05e1f7deb05c6065b588cffb086200e01e9922',
              'skill/plan-and-execute/LICENSE.txt': '2673117de9ed7a5a5a6abd5c4f7e8d19a76b5f90',
              'skill/plan-and-execute/agents/openai.yaml': 'd8d73b78ae9be4a47b356e269633e555a45e4797',
              'skill/plan-and-execute/references/INSTALLATION.md': 'f9d4a9bd37f7c15e4f7d05fad0d0219d0a8c9944',
              'skill/plan-and-execute/references/MODEL_ROUTING.md': 'a00dc1026843d48a79c501034186c741aa667611',
              'skill/plan-and-execute/references/completion-report.schema.json': 'b78c383f57f1a8c34f86eb9d730b67e72433431e',
              'skill/plan-and-execute/references/plan-spec.example.json': 'c086e66542749acb3faac993e2804a81dba26138',
              'tools/run-skill-self-test.js': '0b31ee8ebf7a3c9612ea199e6c768ddeab1ee1b0',
              'tools/validate-skill.js': '67c16b7857ec9790c25d16caeea1687d376380f3',
          }

          archive_files = {
              'skill/plan-and-execute/SKILL.md': '2388691d93853398aab5646b2d78fb273adc9128',
              'skill/plan-and-execute/references/PLANNING_PROTOCOL.md': '678283af95608f85efde2c0ccade42594fb5ad1b',
              'skill/plan-and-execute/references/PLAN_SPEC.md': '109c0060494b854fb8529cd24e56091600d3bb45',
              'skill/plan-and-execute/references/WORKFLOW.md': 'e8928ec683b8bd17a6c390a3b84e7d51d32f6298',
              'skill/plan-and-execute/scripts/planctl.py': '75c677f92cbc48318a08d50f826ad4a4db419574',
              'skill/plan-and-execute/scripts/run_isolated.py': '3e7cd518a29a4a3ea4d8faa9e2e7f9c6311e44f6',
              'skill/plan-and-execute/scripts/self_test.py': 'f8d0a9b8a1168d786db0e85af5a075c28430fd4e',
              'test/installer.test.js': '83260f27145bee1effb8bea52ce8c3211d5a5cf6',
          }

          executable = {
              'bin/plan-and-execute.js',
              'skill/plan-and-execute/scripts/planctl.py',
              'skill/plan-and-execute/scripts/run_isolated.py',
              'skill/plan-and-execute/scripts/self_test.py',
              'tools/run-skill-self-test.js',
              'tools/validate-skill.js',
          }

          def request_json(path: str) -> dict:
              request = urllib.request.Request(f'{api}{path}', headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          def fetch_blob(sha: str) -> bytes:
              payload = request_json(f'/git/blobs/{sha}')
              return base64.b64decode(payload['content'])

          def git_blob_sha(data: bytes) -> str:
              header = f'blob {len(data)}\0'.encode()
              return hashlib.sha1(header + data).hexdigest()

          for relative, sha in direct_blobs.items():
              data = fetch_blob(sha)
              if git_blob_sha(data) != sha:
                  raise SystemExit(f'Blob verification failed for {relative}')
              target = Path(relative)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)

          tree_sha = 'a501221fe055e7ad1d89ac4eb0a686991908331a'
          tree = request_json(f'/git/trees/{tree_sha}?recursive=1')['tree']
          parts = sorted(
              (entry for entry in tree if entry['type'] == 'blob' and entry['path'].startswith('.bootstrap/hex-part-')),
              key=lambda entry: entry['path'],
          )
          if len(parts) != 19:
              raise SystemExit(f'Expected 19 main archive chunks, found {len(parts)}')

          archive_hex = ''.join(fetch_blob(entry['sha']).decode().strip() for entry in parts)
          archive = bytes.fromhex(archive_hex)
          expected_archive = 'f98c6945e8712b296aa06def7aa9ccab348eb99aec70ebebc0e41b2549fc4f0e'
          if hashlib.sha256(archive).hexdigest() != expected_archive:
              raise SystemExit('Main archive SHA-256 mismatch')
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:xz') as bundle:
              bundle.extractall('.', filter='data')

          cli_hex = ''''''
          cli_archive = bytes.fromhex(cli_hex)
          expected_cli = 'ce978fcf298e8fe09e3f20453b1bab2394e04aac9eabfac5cde34d7e7ef9011c'
          if hashlib.sha256(cli_archive).hexdigest() != expected_cli:
              raise SystemExit('CLI test archive SHA-256 mismatch')
          with tarfile.open(fileobj=io.BytesIO(cli_archive), mode='r:xz') as bundle:
              bundle.extractall('.', filter='data')

          expected_files = {
              **direct_blobs,
              **archive_files,
              'test/cli.test.js': 'b684f72b4af1e04e4be0b16e6c1dd440c745ced2',
          }
          if len(expected_files) != 31:
              raise SystemExit(f'Expected 31 repository files, got {len(expected_files)}')

          for relative, expected_sha in expected_files.items():
              target = Path(relative)
              if not target.is_file():
                  raise SystemExit(f'Missing reconstructed file: {relative}')
              actual_sha = git_blob_sha(target.read_bytes())
              if actual_sha != expected_sha:
                  raise SystemExit(f'Git blob mismatch for {relative}: {actual_sha}')
              target.chmod(0o755 if relative in executable else 0o644)

          bootstrap = Path('.github/workflows/bootstrap.yml')
          if bootstrap.exists():
              bootstrap.unlink()
          shutil.rmtree('.bootstrap', ignore_errors=True)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate and test
        run: npm run check

      - name: Verify npm package contents
        run: npm pack --dry-run

      - name: Commit complete repository
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: publish plan-and-execute v0.2.0'
          git push origin HEAD:main
