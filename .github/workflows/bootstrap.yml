name: Publish complete repository

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap.yml'
      - '.bootstrap-payload/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Reconstruct repository
        shell: bash
        run: |
          cat \
            .bootstrap-payload/chunk-001 \
            .bootstrap-payload/chunk-002 \
            .bootstrap-payload/chunk-003a \
            .bootstrap-payload/chunk-003b \
            .bootstrap-payload/chunk-003c \
            .bootstrap-payload/chunk-003d \
            .bootstrap-payload/chunk-004 \
            .bootstrap-payload/chunk-005 \
            .bootstrap-payload/chunk-006 \
            .bootstrap-payload/chunk-007a \
            .bootstrap-payload/chunk-007b-1 \
            .bootstrap-payload/chunk-007b-2 \
            .bootstrap-payload/chunk-007b-3 \
            .bootstrap-payload/chunk-007b-4 \
            .bootstrap-payload/chunk-007c-1 \
            .bootstrap-payload/chunk-007c-2 \
            .bootstrap-payload/chunk-007c-3 \
            .bootstrap-payload/chunk-007c-4 \
            .bootstrap-payload/chunk-007d-1 \
            .bootstrap-payload/chunk-007d-2 \
            > /tmp/repo.zip.b64
          base64 --decode /tmp/repo.zip.b64 > /tmp/repo.zip
          echo '264a8445cc16651a54ae9c44c5c30cc3e7d3f21a4f6d2674b90d6c89fc5c3277  /tmp/repo.zip' | sha256sum --check --strict
          rm -rf /tmp/extract
          mkdir -p /tmp/extract
          unzip -q /tmp/repo.zip -d /tmp/extract
          test -f /tmp/extract/plan-and-execute/package.json
          rsync -a --delete --exclude='.git' /tmp/extract/plan-and-execute/ ./
          chmod +x bin/plan-and-execute.js skill/plan-and-execute/scripts/*.py tools/*.js

      - name: Install dependencies
        run: npm ci

      - name: Validate and test
        run: npm run check

      - name: Verify npm package contents
        run: npm pack --dry-run

      - name: Commit complete repository
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: publish plan-and-execute v0.2.0'
          git push origin HEAD:main
