name: PAE Claude - verify GitHub secret availability (no model invocation)

on:
  push:
    branches:
      - checkpoint/plano1-estudo-provider-switch-20261028
    paths:
      - '.github/workflows/pae-claude-secret-check.yml'
  workflow_dispatch:

permissions: {}

jobs:
  verify-secret-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify Claude OAuth secret is accessible without displaying it
        shell: bash
        env:
          CLAUDE_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${CLAUDE_OAUTH:-}" ]]; then
            echo "::notice title=OAuth secret available::CLAUDE_CODE_OAUTH_TOKEN is configured and exposed to this workflow."
          else
            echo "::error title=OAuth secret missing::CLAUDE_CODE_OAUTH_TOKEN is absent or unavailable to this workflow."
            exit 2
          fi
          # Validate only token structure. Never print or store the secret.
          if [[ "${CLAUDE_OAUTH}" != sk-ant-oat01-* ]]; then
            echo "::error title=OAuth token format::The stored secret is not a Claude OAuth setup-token."
            exit 3
          fi
          if [[ "${CLAUDE_OAUTH}" =~ [[:space:]] ]]; then
            echo "::error title=OAuth token whitespace::The secret contains spaces or line breaks; paste the complete token as one line."
            exit 4
          fi
          if (( ${#CLAUDE_OAUTH} < 100 || ${#CLAUDE_OAUTH} > 400 )); then
            echo "::error title=OAuth token size::The stored secret has an unusual size and may be truncated."
            exit 5
          fi
          echo "::notice title=OAuth token format::The secret is available and structurally plausible (not proof that Anthropic accepts it)."
