name: PAE Claude - minimal OAuth model authentication smoke test

on:
  push:
    branches:
      - checkpoint/plano1-estudo-provider-switch-20261028
    paths:
      - '.github/workflows/pae-claude-auth-smoke.yml'

permissions:
  contents: read

jobs:
  auth-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout for diagnostic script only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Minimal authentic Claude Opus reply (no task review or code reads)
        id: smoke
        uses: anthropics/claude-code-action/base-action@acfe7992852970efb4fee683d63d628e3e52df67
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: 'false'
          prompt: "Authentication smoke test only. Respond with exactly CLAUDE_AUTH_OK. Do not access files, execute tools, or modify anything."
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 1
      - name: Fail closed unless actual model inference succeeded
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'claude-execution-output.json'
          if not p.is_file() or p.stat().st_size > 4_000_000:
              raise SystemExit('MODEL_SMOKE_FAIL: model execution log missing/oversized')
          events=json.loads(p.read_text(encoding='utf-8'))
          if isinstance(events,dict):
              events=events.get('messages',events.get('events',[]))
          if not isinstance(events,list):
              raise SystemExit('MODEL_SMOKE_FAIL: invalid events structure')
          results=[x for x in events if isinstance(x,dict) and x.get('type')=='result']
          init=[x for x in events if isinstance(x,dict) and x.get('type')=='system' and x.get('subtype')=='init']
          if not results or not init:
              raise SystemExit('MODEL_SMOKE_FAIL: no authentic model execution events')
          result=results[-1]
          model=init[-1].get('model')
          usage=result.get('modelUsage')
          if (model!='claude-opus-5-5' or result.get('is_error') is not False or
              not isinstance(result.get('num_turns'),int) or result['num_turns']<1 or
              not isinstance(usage,dict) or not usage):
              raise SystemExit('MODEL_SMOKE_FAIL: no successful Claude Opus inference (no secrets printed)')
          print('MODEL_SMOKE_OK: Claude Opus inference succeeded and model usage was present; no secret exposed')
          PY
      - name: Diagnose failures without secrets or raw model transcripts
        if: failure()
        run: python .ai-work/chatgpt-executor/claude_diag.py
