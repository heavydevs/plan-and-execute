name: Retry context-isolation implementation payload

on:
  push:
    branches:
      - feat/context-isolated-todos-providers
    paths:
      - .github/workflows/apply-context-isolation-payload-retry.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/context-isolated-todos-providers
          fetch-depth: 0

      - name: Reconstruct and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cat .pae-bootstrap/payload.part-* > /tmp/plan-and-execute-payload.b64
          base64 --decode /tmp/plan-and-execute-payload.b64 > /tmp/plan-and-execute-payload.tar.xz
          echo "ba02161d1d16df39d5727877e7b869249d9357b59c3dcfa70c8a5c9c1fc2c581  /tmp/plan-and-execute-payload.tar.xz" | sha256sum --check --strict
          tar -xJf /tmp/plan-and-execute-payload.tar.xz -C .
          rm -rf .pae-bootstrap

      - name: Validate implementation
        run: npm run check

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "feat: isolate TODO contexts and add provider adapters"
          git push origin HEAD:feat/context-isolated-todos-providers
