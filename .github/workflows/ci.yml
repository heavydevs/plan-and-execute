name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22, 24]
        python-version: ['3.13']
        include:
          # Lowest supported interpreter (README: Python 3.10+).
          - node-version: 22
            python-version: '3.10'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run
      - name: Package independently installable skills
        if: matrix.node-version == 24
        run: npm run package:skills
      - name: Upload main skill
        if: matrix.node-version == 24
        uses: actions/upload-artifact@v4
        with:
          name: plan-and-execute-skill
          path: dist/plan-and-execute/skill.zip
          if-no-files-found: error
      - name: Upload validation skill
        if: matrix.node-version == 24
        uses: actions/upload-artifact@v4
        with:
          name: validate-or-fix-skill
          path: dist/validate-or-fix/skill.zip
          if-no-files-found: error

  # The runner, lifecycle lease, installer, and CLI have Windows-specific paths
  # (CreateProcess cannot launch .cmd shims, shlex strips backslashes, the Store
  # python alias exits 9009). Keep them covered on a real Windows runner.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run check
