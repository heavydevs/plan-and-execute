name: Apply plan-and-execute v0.3.0

on:
  push:
    paths:
      - .github/workflows/apply-v0.3.0.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruct and apply the validated update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          chunks=(
            6c5fc59f2b621bae70090ff99cddf3977246217f
            94d34935a4208e9ea601a972d8e73beb24f2dfa5
            d8610b0b85d7a3f0613c6d00741a6fe3ac553aa5
            cbef2a4b7757238e29bee7869645455a8f112efc
            fdc0312764016d51a323a01727ec3be843dc862f
            9d217308428074915ab586f5cdf2fd13570acb7f
            928ed0d88c38bf6a52af7d437822ae198ccc90f9
            3e3ae4a39b7dcb6f0973974ca8149bb47a066e39
            712320b0ee35607e98b3b97c7d214051ff0776fd
            0d0920bdbd3e5aa74d015d21ead97e845e194419
          )

          : > /tmp/plan-and-execute-v0.3.0.b64
          for sha in "${chunks[@]}"; do
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' \
              | tr -d '\n' \
              | base64 --decode \
              >> /tmp/plan-and-execute-v0.3.0.b64
          done

          test "$(wc -c < /tmp/plan-and-execute-v0.3.0.b64)" -eq 69312
          base64 --decode /tmp/plan-and-execute-v0.3.0.b64 \
            > /tmp/plan-and-execute-v0.3.0.tar.xz
          echo "403018c798fc8680702dc3c44b6a2ebf796e148584da12d835acf96cdb8ba4e5  /tmp/plan-and-execute-v0.3.0.tar.xz" \
            | sha256sum --check --strict
          tar -xJf /tmp/plan-and-execute-v0.3.0.tar.xz -C "${GITHUB_WORKSPACE}"

      - name: Install dependencies
        run: npm ci

      - name: Run complete validation suite
        run: npm run check

      - name: Verify npm package contents
        run: npm pack --dry-run --ignore-scripts

      - name: Commit the validated release
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-v0.3.0.yml
          npm run clean
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add guided request intake and bilingual docs"
          git push origin HEAD:main
