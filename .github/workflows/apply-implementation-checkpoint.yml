name: Apply implementation checkpoint

on:
  push:
    branches: [feature/auxiliary-assistants-tier-routing-20260928]
    paths: ['.ai-work/submission/**']

permissions:
  contents: write

concurrency:
  group: auxiliary-routing-checkpoint
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/feature/auxiliary-assistants-tier-routing-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify and apply the exact checkpoint
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path
          request = json.loads(Path('.ai-work/submission/request.json').read_text())
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          if parent != request['base']:
              raise SystemExit('Checkpoint parent changed; reconcile rather than overwrite.')
          chunks = sorted(Path('.ai-work/submission').glob('part*.b64'))
          encoded = ''.join(p.read_text().strip() for p in chunks)
          decoder = lzma.LZMADecompressor(memlimit=64 * 1024 * 1024)
          patch = decoder.decompress(base64.b64decode(encoded, validate=True), max_length=4 * 1024 * 1024)
          if not decoder.eof or decoder.unused_data:
              raise SystemExit('Oversized or trailing checkpoint data.')
          if hashlib.sha256(patch).hexdigest() != request['sha256']:
              raise SystemExit('Checkpoint checksum mismatch.')
          subprocess.run(['git', 'apply', '--check', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          Path('/tmp/checkpoint-message').write_text(request['message'])
          validation = {'001':'REQUIREMENTS', '002':'ROUTING_CONFIG', '003':'AVAILABILITY', '004':'CONFIGURE', '005':'ASSISTANT', '006':'ALL'}[request['task']]
          Path('/tmp/checkpoint-validation').write_text(validation)
          PY
      - name: Validate the checkpoint independently
        shell: bash
        run: |
          set -o pipefail
          python .ai-work/20260928-auxiliary-routing/rebind.py --repo-root .
          python skill/plan-and-execute/scripts/service_map.py stamp --repo-root . --map .ai-work/SERVICE_MAP.md
          python skill/plan-and-execute/scripts/resource_watch.py run --repo-root . --map .ai-work/SERVICE_MAP.md --validation "$(cat /tmp/checkpoint-validation)" 2>&1 | tee /tmp/checkpoint-validation.log
      - name: Publish source and retained plan without force
        shell: bash
        run: |
          git rm -r .ai-work/submission
          git add -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -F /tmp/checkpoint-message
          git push origin HEAD:feature/auxiliary-assistants-tier-routing-20260928
      - name: Preserve recovery evidence
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/checkpoint-artifact
          git bundle create /tmp/checkpoint-artifact/repository.bundle --all
          git diff --binary HEAD > /tmp/checkpoint-artifact/uncommitted.patch
          git rev-parse HEAD > /tmp/checkpoint-artifact/HEAD.txt
          cp /tmp/checkpoint-validation.log /tmp/checkpoint-artifact/validation.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: applied-implementation-checkpoint
          path: /tmp/checkpoint-artifact
          retention-days: 7
          if-no-files-found: error
