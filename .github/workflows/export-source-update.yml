name: Export source for resumable lifecycle update

on:
  push:
    branches:
      - feat/resumable-lifecycle
    paths:
      - .github/workflows/export-source-update.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Package repository source
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=.ai-work \
            --exclude=node_modules \
            -czf /tmp/plan-and-execute-source.tar.gz .
      - name: Upload repository source
        uses: actions/upload-artifact@v4
        with:
          name: plan-and-execute-source
          path: /tmp/plan-and-execute-source.tar.gz
          if-no-files-found: error
          retention-days: 1
