name: Windows review checkpoint
on:
  push:
    branches: [feature/auxiliary-assistants-tier-routing-20260928]
    paths: ['.ai-work/windows-review-trigger']
permissions:
  contents: write
jobs:
  review:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply reviewed native-platform corrections
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          if parent != '3c8224c24f60e09595b441d283274837445985d4':
              raise SystemExit('Review parent changed; reconcile before applying.')
          changes = [
              ('skill/plan-and-execute/scripts/self_test.py', 'assert draft.parent == repo / ".ai-work" / "intake"', 'assert draft.parent == (repo / ".ai-work" / "intake").resolve()'),
              ('tools/run-skill-self-test.js', "? [['py', ['-3']], ['python', []], ['python3', []]]", "? [['python', []], ['python3', []], ['py', ['-3']]]"),
              ('skill/plan-and-execute/scripts/preplan_self_test.py',
               '        repository = root.joinpath(*(["deep_repository_path"] * 12))\n        repository.mkdir(parents=True)\n',
               '        repository = root.joinpath(*(["deep_repository_path"] * 12))\n        # Windows CreateProcess rejects cwd > MAX_PATH even with long paths on.\n        # Keep only the process cwd short; package/plan paths still exceed 260.\n        if sys.platform == "win32":\n            while len(str(repository)) > 230 and repository != root:\n                repository = repository.parent\n        repository.mkdir(parents=True)\n'),
              ('skill/plan-and-execute/scripts/preplan_self_test.py',
               '        package = repository / preplanctl.PREPARED_ROOT / package_id\n        plan_dir = ',
               '        package = repository / preplanctl.PREPARED_ROOT / package_id\n        assert len(str(package / "package.json")) > 260\n        plan_dir = '),
          ]
          for name, old, new in changes:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit('Expected unique preimage: ' + name)
              p.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Run complete native Windows suite
        shell: bash
        run: |
          set -o pipefail
          npm ci
          npm run check 2>&1 | tee windows-review-validation.log
      - name: Preserve task 006 follow-up and push validated corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.ai-work/20260928-auxiliary-routing/WINDOWS_REVIEW.md')
          p.write_text('''# Task 006 native Windows follow-up

          The PR matrix exposed an existing request-intake test comparing a canonical
          path against an unresolved Windows temporary path. It now compares resolved
          paths without weakening the expected destination.

          The launcher preferred py -3 and selected Python 3.14 despite CI configuring
          3.11. It now respects Python on PATH before launcher fallback, preserving the
          declared interpreter and activated virtual environments.

          The deep-path fixture now keeps only Windows subprocess cwd below 230 chars.
          CreateProcess cannot use cwd beyond MAX_PATH even with long paths enabled.
          Generated package paths still exceed 260 chars, explicitly asserted; the CLI
          validation and relative-guidance assertions remain intact. Linux depth is
          unchanged. Reference: https://learn.microsoft.com/en-us/windows/win32/api/winbase/nf-winbase-setcurrentdirectory

          Complete npm run check passed on native Windows, Node 22 and configured
          Python 3.11 before this follow-up commit. Linux full validation passed at
          source checkpoint 6bb047db. Final PR CI checks all matrix entries again.
          Platform-specific skips remain explicit.

          This is additional validation within completed task 006. All plan artifacts
          remain. Native model generation and cost/quality experiments were not run.
          ''', encoding='utf-8')
          PY
          git add skill/plan-and-execute/scripts/self_test.py skill/plan-and-execute/scripts/preplan_self_test.py tools/run-skill-self-test.js
          git add -f .ai-work/20260928-auxiliary-routing/WINDOWS_REVIEW.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(test): preserve deep-path coverage and selected Python on Windows'
          git push origin HEAD:feature/auxiliary-assistants-tier-routing-20260928
      - name: Preserve recovery checkpoint
        if: always()
        shell: bash
        run: |
          mkdir -p checkpoint-artifact
          git bundle create checkpoint-artifact/repository.bundle --all
          git diff --binary HEAD > checkpoint-artifact/uncommitted.patch
          git rev-parse HEAD > checkpoint-artifact/HEAD.txt
          cp windows-review-validation.log checkpoint-artifact/validation.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-review-checkpoint
          path: checkpoint-artifact
          retention-days: 7
          if-no-files-found: error
