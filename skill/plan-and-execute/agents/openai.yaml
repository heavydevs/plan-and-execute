interface:
  display_name: "Plan and Execute"
  short_description: "Study evidence, plan, review, and execute large coding changes"
  default_prompt: "Use $plan-and-execute. If no request was supplied, create and open the guided request file, then wait for my confirmation. If I supplied a file path, use that complete file as the request. Before drafting requirements or TODOs, run the adaptive study gate: perform mandatory internal repository study, explicitly assess external-research triggers, use authoritative sources only when triggered, synthesize exact planning impacts, review evidence sufficiency, and require the studyctl validation gate. Then build a traceable recursively decomposed plan, attach the study to prove it affected constraints, requirements, risks, and validation, require studyctl validate-plan plus planctl validate and audit, and execute each approved TODO in an isolated worker with deterministic validation, resumable state, evidence-based escalation, economical final summarization, and cleanup limited to planning artifacts."
