interface:
  display_name: Plan and Execute
  short_description: Orchestrate long work and route models economically
  default_prompt: 'Use $plan-and-execute. Apply its DIRECT vs ORCHESTRATED gate before creating plan state. Prefer direct execution for cohesive small/medium work; use the resumable TODO harness only when independent workstreams, broad research, migration risk, durable resume value, or isolation justify it. If direct work later grows, promote it and plan only remaining outcomes. In both modes apply adaptive economical routing: deterministic lookup first, cheap read-only exploration subagents for context-heavy discovery, normal implementation on cost-efficient models, and stronger/frontier routes only when semantic risk, weak validation, or failure evidence justifies them. Load only the active provider routing reference. Preserve per-TODO provider/model tier/effort routing, deterministic validation, lifecycle recovery, and implementation changes.'
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
