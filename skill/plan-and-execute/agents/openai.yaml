interface:
  display_name: Plan and Execute
  short_description: Orchestrate long work with portable model routing
  default_prompt: 'Use $plan-and-execute. Apply its DIRECT vs ORCHESTRATED gate before creating plan state. Prefer direct execution for cohesive small/medium work; use the resumable TODO harness only when independent workstreams, broad research, migration risk, durable resume value, or isolation justify it. If direct work later grows, promote it and plan only remaining outcomes. In both modes apply adaptive economical routing: deterministic lookup first, cheap read-only exploration for context-heavy discovery, and stronger/frontier capability only when semantic risk, weak validation, or failure evidence justifies it. For new orchestrated plans preserve provider-neutral per-TODO F1-F4 model-family and L1-L5 reasoning-level requirements, dynamically build the current Codex/Claude/Gemini/Qwen/Muse compatibility table during planning, and keep concrete provider/model/effort only as replaceable compatibility/execution state. Preserve deterministic validation, lifecycle recovery, and implementation changes.'
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
