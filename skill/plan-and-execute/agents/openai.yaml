interface:
  display_name: Plan and Execute
  short_description: Route direct, staged planning, and resumable execution economically
  default_prompt: 'Use $plan-and-execute. Apply its three-way gate before loading heavy planning instructions: keep cohesive small/medium work DIRECT; for planned work use ordinary FINAL_PLAN when the authoritative request is manageable; when request volume/breadth would make final planning credit-heavy or non-resumable, use the isolated PRIMARY_PLAN protocol to deterministically fragment/index the source and build a resumable prepared package first. Never load PRIMARY_PLANNING.md on normal FINAL_PLAN work. Route planning stages independently from the root model and independently from implementation TODO routes. Preserve per-TODO provider/model tier/effort routing, deterministic validation, lifecycle recovery, and implementation changes. When multiple TODOs share a normative contract that may evolve, use versioned shared-pattern files with explicit signatories; a pattern revision must reopen only completed signatories that adopted an older revision.'
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
