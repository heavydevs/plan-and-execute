interface:
  display_name: Plan and Execute
  short_description: Route direct, staged planning, and resumable execution economically
  default_prompt: 'Use $plan-and-execute. Apply DIRECT vs ORCHESTRATED first: keep cohesive small/medium work DIRECT and promote only substantial remaining outcomes. For ORCHESTRATED work, use FINAL_PLAN when the authoritative request is manageable; when request volume/breadth makes final planning credit-heavy or non-resumable, use isolated PRIMARY_PLAN to deterministically fragment/index the source and build a resumable prepared package first. Never load PRIMARY_PLANNING.md on normal FINAL_PLAN work. Route planning stages independently from the root model and independently from implementation TODO routes. Preserve per-TODO provider/model tier/effort routing, deterministic validation, lifecycle recovery, and implementation changes. For evolving cross-TODO normative contracts, use versioned shared patterns with explicit signatories and reopen only stale completed signatories after a revision.'
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
