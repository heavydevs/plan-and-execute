interface:
  display_name: Plan and Execute
  short_description: Isolate TODO context, persist checkpoints, and execute safely
  default_prompt: 'Use $plan-and-execute. Treat context as a budget: load detailed references only for the current phase, persist authoritative state on disk, execute each TODO in a fresh isolated worker with only its assigned task/context/learnings, rerun deterministic validation outside workers, and after successful final verification and handoff delete only the verified planning/control workspace while preserving all implementation changes.'
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
